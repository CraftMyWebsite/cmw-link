plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'cmw-link'

// API module
include 'Versions'

// Version-specific adapter modules (Java 11)
include 'v1_16_R1'
include 'v1_16_R2'
include 'v1_16_R3'
include 'v1_17_R1'
include 'v1_18_R1'
include 'v1_18_R2'
include 'v1_19_R1'
include 'v1_19_R2'
include 'v1_19_R3'
include 'v1_20_R1'
include 'v1_20_R2'
include 'v1_20_R3'

// Version-specific adapter modules (Java 21)
include 'v1_20_R4'
include 'v1_21_R1'
include 'v1_21_R2'
include 'v1_21_R3'

// Core and feature modules
include 'core'
include 'news'
include 'shop'
include 'votes'

plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

dependencies {
    // Versions API (exposed to modules that depend on Core)
    api project(':Versions')

    // External dependencies (provided by server)
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    compileOnly 'org.spigotmc:spigot-api:1.13.2-R0.1-SNAPSHOT'
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2'
    compileOnly 'com.velocitypowered:velocity-api:3.1.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.1.1'

    // Dependencies to include in fat JAR
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'io.netty:netty-all:4.1.108.Final'
    implementation 'com.google.code.gson:gson:2.10.1'
}

shadowJar {
    archiveBaseName = 'CraftMyWebsite_Link'
    archiveVersion = ''

    // Prevent replacing the default JAR with shadowJar
    // This avoids circular dependency with v1_* modules
    archiveClassifier = 'all'  // Use classifier to make it a separate artifact

    // Ensure all version adapter JARs and Versions JAR are built first
    dependsOn ':Versions:jar',
              ':v1_16_R1:jar', ':v1_16_R2:jar', ':v1_16_R3:jar',
              ':v1_17_R1:jar', ':v1_18_R1:jar', ':v1_18_R2:jar',
              ':v1_19_R1:jar', ':v1_19_R2:jar', ':v1_19_R3:jar',
              ':v1_20_R1:jar', ':v1_20_R2:jar', ':v1_20_R3:jar', ':v1_20_R4:jar',
              ':v1_21_R1:jar', ':v1_21_R2:jar', ':v1_21_R3:jar', ':v1_21_R4:jar', ':v1_21_R5:jar'

    // Include Versions API and version adapters in the fat JAR by extracting their contents
    from { project(':Versions').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_16_R1').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_16_R2').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_16_R3').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_17_R1').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_18_R1').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_18_R2').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_19_R1').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_19_R2').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_19_R3').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_20_R1').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_20_R2').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_20_R3').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_20_R4').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_21_R1').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_21_R2').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_21_R3').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_21_R4').tasks.jar.outputs.files.collect { zipTree(it) } }
    from { project(':v1_21_R5').tasks.jar.outputs.files.collect { zipTree(it) } }

    // Exclude provided dependencies from fat JAR
    dependencies {
        exclude(dependency('org.projectlombok:lombok'))
        exclude(dependency('org.spigotmc:spigot-api'))
        exclude(dependency('net.md-5:bungeecord-api'))
        exclude(dependency('com.velocitypowered:velocity-api'))
    }

    // Relocate dependencies to avoid conflicts
    relocate 'com.google.gson', 'fr.CraftMyWebsite.CMWLink.libs.gson'
    relocate 'io.netty', 'fr.CraftMyWebsite.CMWLink.libs.netty'
    relocate 'org.mindrot.jbcrypt', 'fr.CraftMyWebsite.CMWLink.libs.jbcrypt'
}

jar {
    archiveBaseName = 'core'
}

// Create a custom task to build the shadowJar after all v1_* modules are built
tasks.register('buildAll') {
    description = 'Builds core JAR and shadowJar with all version adapters'
    group = 'build'

    dependsOn jar, shadowJar
}

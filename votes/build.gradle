plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    compileOnly project(':core')
    compileOnly 'org.spigotmc:spigot-api:1.19.3-R0.1-SNAPSHOT'
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2'
    compileOnly 'com.velocitypowered:velocity-api:3.1.1'
    compileOnly 'me.clip:placeholderapi:2.11.7'
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

shadowJar {
    archiveBaseName = 'CMWL_Votes'
    archiveVersion = ''
    archiveClassifier = ''

    dependencies {
        exclude(dependency('org.projectlombok:lombok'))
        exclude(dependency('org.spigotmc:spigot-api'))
        exclude(dependency('net.md-5:bungeecord-api'))
        exclude(dependency('com.velocitypowered:velocity-api'))
        exclude(dependency('me.clip:placeholderapi'))
        exclude(dependency('fr.CraftMyWebsite.CMWL:core'))
    }
}

build.dependsOn shadowJar
